<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Panquecas Edificando Campo</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1794160778">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0}
.tabs button{background:#fff;padding:10px 16px;border-radius:99px;color:var(--purple);font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--purple);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted)}.kpi b{display:block;font-size:1.5rem;color:var(--purple)}
.panel{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow);margin:14px 0}
.orow{border-bottom:1px solid var(--cream-2);padding:12px 0}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--cream-2)}
@media print{.tabs,header,.noprint{display:none!important}.panel{box-shadow:none}}
</style>
</head>
<body>
<header class="hero" style="padding:20px 16px"><div class="logo">edificando<small>campo</small></div><div class="tag" style="margin-top:6px">Painel de vendas</div></header>
<main class="container" style="padding-bottom:40px">
  <section id="login" class="panel" style="max-width:400px;margin:30px auto">
    <h2 style="color:var(--purple)">Entrar</h2>
    <form id="loginForm"><input type="hidden" autocomplete="username" value="admin@edificandocampo.com">
      <label>Senha de admin</label><input id="pass" type="password" required>
      <button class="btn block" style="margin-top:16px">Entrar</button></form>
    <p id="loginErr" style="color:var(--danger);margin-top:8px"></p>
  </section>

  <section id="app" class="hidden">
    <div class="row"><span id="who" style="color:var(--muted);font-size:.85rem"></span><button class="btn ghost sm" id="logout">Sair</button></div>
    <nav class="tabs">
      <button data-tab="dash" class="on">Dashboard</button><button data-tab="orders">Pedidos</button>
      <button data-tab="prod">Produção</button><button data-tab="products">Sabores</button><button data-tab="cfg">Configurações</button>
    </nav>

    <div data-view="dash">
      <div class="kpis" id="kpis"></div>
      <div class="panel"><h3>Vendidas por sabor</h3><canvas id="chartFlavors" height="180"></canvas></div>
      <div class="panel"><h3>Pedidos por dia</h3><canvas id="chartDays" height="160"></canvas></div>
    </div>

    <div data-view="orders" class="hidden">
      <div class="filters"><input id="search" placeholder="Buscar por nome ou nº"><select id="fStatus"><option value="">Todos</option></select></div>
      <div class="panel" id="orderList"></div>
    </div>

    <div data-view="prod" class="hidden">
      <div class="panel"><div class="row"><h3>Relatório de produção (pedidos pagos/confirmados)</h3><button class="btn sm noprint" onclick="print()">Imprimir</button></div>
        <table id="prodTable"></table></div>
      <div class="panel"><h3>Fila de entrega</h3><div id="deliveryList"></div></div>
    </div>

    <div data-view="products" class="hidden">
      <div class="panel"><h3 id="pfTitle">Novo sabor</h3>
        <form id="pForm"><input type="hidden" id="pId">
          <label>Nome</label><input id="pName" required maxlength="60">
          <label>Ingredientes / descrição</label><textarea id="pDesc" rows="2" maxlength="300"></textarea>
          <div class="filters" style="grid-template-columns:1fr 1fr 1fr"><div><label>Preço (R$)</label><input id="pPrice" type="number" step="0.01" min="0" required></div>
            <div><label>Estoque (vazio = sem limite)</label><input id="pStock" type="number" min="0"></div>
            <div><label>Ordem</label><input id="pOrder" type="number" value="0"></div></div>
          <label>Foto</label><input id="pImg" type="file" accept="image/*">
          <label class="pay-opt"><input type="checkbox" id="pActive" checked> Ativo (aparece no cardápio)</label>
          <label class="pay-opt"><input type="checkbox" id="pAvail" checked> Disponível para venda</label>
          <button class="btn">Salvar</button> <button type="button" class="btn ghost" id="pReset">Limpar</button>
        </form></div>
      <div class="panel" id="productList"></div>
    </div>

    <div data-view="cfg" class="hidden"><div class="panel">
      <form id="cfgForm">
        <label class="pay-opt"><input type="checkbox" id="cOpen"> Vendas abertas</label>
        <label class="pay-opt"><input type="checkbox" id="cPix"> Aceitar PIX</label>
        <label class="pay-opt"><input type="checkbox" id="cPres"> Aceitar pagamento presencial</label>
        <label>Texto sobre a arrecadação</label><textarea id="cAbout" rows="3"></textarea>
        <button class="btn" style="margin-top:12px">Salvar configurações</button>
      </form></div></div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script type="module" src="js/admin.js?v=1794160778"></script>
</body>
</html>
