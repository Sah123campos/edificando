<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu pedido · Edificando Campo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1794235000">
</head>
<body>
<header class="hero" style="padding:28px 16px"><a href="index.html" style="text-decoration:none"><div class="logo">edificando<small>campo</small></div></a></header>
<main class="container" style="max-width:560px">
  <div class="order" id="order"><p><span class="spinner"></span> Carregando pedido…</p></div>
</main>
<div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module" src="js/presenca.js?v=1794235000"></script>
<script type="module">
import { db, brl, esc, STATUS, FLOW } from "./js/firebase.js?v=1794235000";
import { pixPayload, PIX } from "./js/pix.js?v=1794235000";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const token = new URLSearchParams(location.search).get("t");
const el = document.getElementById("order");
if (!token || !/^[0-9a-f]{32}$/.test(token)) el.innerHTML = "<p>Link de pedido inválido.</p>";
else onSnapshot(doc(db, "publicOrders", token), (s) => {
  if (!s.exists()) { el.innerHTML = "<p>Pedido não encontrado.</p>"; return; }
  const o = s.data(), idx = FLOW.indexOf(o.status), paid = o.paymentStatus === "pago";
  const waiting = o.status === "aguardando_pagamento" && o.paymentMethod === "pix";
  const code = waiting ? pixPayload(o.totalCents, o.number) : "";
  let qr = "";
  if (waiting) { const q = qrcode(0, "M"); q.addData(code); q.make(); qr = q.createDataURL(6, 8); }
  el.innerHTML = `
    <span class="badge ${paid ? "ok" : ""}">${paid ? "Pago" : o.paymentMethod === "presencial" ? "Pagar na retirada" : "Pagamento pendente"}</span>
    <h2 style="margin-top:8px">Pedido #${esc(o.number)}</h2>
    <p>Olá, <strong>${esc(o.firstName)}</strong>! ${paid ? "Recebemos seu pagamento. 💜" : "Seu pedido foi registrado."}</p>
    <div style="margin:14px 0">${o.items.map((i) => `<div class="row"><span>${i.qty}× ${esc(i.name)}</span><span>${brl(i.qty * i.priceCents)}</span></div>`).join("")}</div>
    <div class="total"><span>Total</span><span>${brl(o.totalCents)}</span></div>
    ${waiting ? `
      <div style="text-align:center;margin-top:8px"><strong>Pague com PIX</strong>
      <img class="qr" src="${qr}" alt="QR Code PIX de ${brl(o.totalCents)}">
      <p style="font-size:.9rem;margin-bottom:8px">ou use o <strong>Pix Copia e Cola</strong>:</p>
      <div class="copy"><input id="cc" readonly value="${esc(code)}"><button class="btn sm" id="copyBtn">Copiar</button></div>
      <p style="font-size:.82rem;color:var(--muted);margin-top:12px">Recebedor: Igreja Evangélica Assembleia de Deus – Ministério de Madureira em São Carlos (Sicredi).<br>
      Depois de pagar, a equipe confere o PIX e confirma seu pedido. Esta página atualiza sozinha.</p></div>` : ""}
    ${o.status === "cancelado" ? `<p class="notice">Este pedido foi cancelado.</p>` : `
    <ul class="steps">${FLOW.map((st, i) => `<li class="${i <= idx ? "done" : ""} ${i === idx ? "current" : ""}">${STATUS[st]}</li>`).join("")}</ul>`}
    <p style="font-size:.85rem;color:var(--muted)">📍 Retirada/entrega: 28/11 na AD Brás São Carlos – Sede. Guarde este link para acompanhar seu pedido.</p>
    <button class="btn ghost block" id="shareBtn">Copiar link do pedido</button>`;
  document.getElementById("copyBtn")?.addEventListener("click", () => { navigator.clipboard.writeText(code); toast("Código PIX copiado! Cole no app do seu banco."); });
  document.getElementById("shareBtn").onclick = () => { navigator.clipboard.writeText(location.href); toast("Link copiado!"); };
}, () => { el.innerHTML = "<p>Não foi possível carregar o pedido. Recarregue a página.</p>"; });
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}
</script>
</body>
</html>
